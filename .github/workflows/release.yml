name: Release

# Pushing a tag like v1.2.3 runs the full CI matrix on that commit, publishes
# the distributions CI built to PyPI, then creates the GitHub release from that
# version's CHANGELOG.md section. Publishing uses PyPI trusted publishing, so
# no API token is stored here; see CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [check, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hachiko/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
